plugins {
    id 'com.android.application'
}

android {
    namespace 'com.scrcpystudio.connect'
    compileSdk 35

    defaultConfig {
        applicationId 'com.scrcpystudio.connect'
        minSdk 30
        targetSdk 34
        versionCode 5
        versionName '1.4'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
